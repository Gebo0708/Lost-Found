<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Result</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/global.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/search_item.css') }}">
</head>

<body>

    <nav>

        <h2 class="logo">School Lost & Found</h2>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/lost_item">Report Item</a></li>
            <li><a href="/search_item" class="active">Search Item</a></li>
            <li><a href="/found_item">Claim Item</a></li>
        </ul>

    </nav>

    <section class="search-container">

        <div class="result-card">

            <h1>Search Result</h1>

            {% if result %}

                <div class="message success">

                    {{ result }}

                </div>

            {% else %}

                <div class="message warning">

                    No search result yet.

                </div>

            {% endif %}

            <div class="button-group">

                <a href="/" class="btn-secondary">
                    Back Home
                </a>

                <a href="/found_item" class="btn-primary">
                    Claim Item
                </a>

            </div>

        </div>

    </section>

</body>

</html>
