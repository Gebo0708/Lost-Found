<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/global.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/lost_item.css') }}">
</head>

<body>

    <nav>

        <h2 class="logo">School Lost & Found</h2>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/lost_item" class="active">Report Item</a></li>
            <li><a href="/search_item">Search Item</a></li>
            <li><a href="/found_item">Claim Item</a></li>
        </ul>

    </nav>

    <section class="report-container">

        <div class="report-card">

            <h1>Report a Found Item</h1>

            <p>
                Found an item on campus? Fill out the form below so the rightful
                owner can locate and claim it.
            </p>

            <form action="/lost_item" method="POST">

                <div class="input-group">

                    <label>Item Name</label>

                    <input
                        type="text"
                        name="item"
                        placeholder="Example: Wallet, ID Card, Umbrella"
                        required>

                </div>

                <div class="input-group">

                    <label>Found By</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Lastname, Firstname"
                        required>

                </div>

                <div class="input-group">

                    <label>Date Found</label>

                    <input
                        type="date"
                        name="trip-start"
                        required>

                </div>

                <button
                    class="btn-primary"
                    type="submit">

                    Submit Report

                </button>

            </form>

        </div>

    </section>

</body>

</html>
